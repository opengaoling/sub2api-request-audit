name: Cleanup GHCR Old Versions

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Old Container Package Versions
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, urllib.error

          token = os.environ.get("TOKEN")
          if not token:
              print("错误: 缺少 GHCR_TOKEN")
              exit(1)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ghcr-cleaner"
          }

          url = "https://api.github.com/user/packages/container/sub2api-request-audit/versions?per_page=100"
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  versions = json.loads(resp.read().decode())
          except Exception as e:
              print(f"获取版本列表失败: {e}")
              exit(1)

          print(f"当前共获取到 {len(versions)} 个版本")

          latest_version = None
          for v in versions:
              tags = v.get("metadata", {}).get("container", {}).get("tags", [])
              if "latest" in tags:
                  latest_version = v
                  break

          if not latest_version:
              print("未找到包含 'latest' 标签的版本，终止删除以防误删！")
              exit(1)

          latest_time_prefix = latest_version["created_at"][:16]
          print(f"最新版 ID: {latest_version['id']}, 标签: {latest_version.get('metadata', {}).get('container', {}).get('tags')}, 创建时间: {latest_version['created_at']}")

          keep_ids = set()
          for v in versions:
              if v["created_at"].startswith(latest_time_prefix):
                  keep_ids.add(v["id"])

          to_delete = [v for v in versions if v["id"] not in keep_ids]
          print(f"保留版本数量: {len(keep_ids)} (IDs: {keep_ids})")
          print(f"待删除版本数量: {len(to_delete)}")

          deleted = 0
          failed = 0

          for v in to_delete:
              v_id = v["id"]
              v_tags = v.get("metadata", {}).get("container", {}).get("tags", [])
              del_url = f"https://api.github.com/user/packages/container/sub2api-request-audit/versions/{v_id}"
              del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(del_req) as resp:
                      if resp.status in (200, 204):
                          deleted += 1
                          print(f"✓ 已删除版本 {v_id} (tags: {v_tags})")
                      else:
                          print(f"状态码异常 {v_id}: {resp.status}")
                          failed += 1
              except urllib.error.HTTPError as e:
                  print(f"✗ 删除失败 {v_id}: HTTP {e.code} - {e.read().decode()}")
                  failed += 1
              except Exception as e:
                  print(f"✗ 删除出错 {v_id}: {e}")
                  failed += 1

          print(f"\n清理完成: 成功删除 {deleted} 个旧版本, 失败 {failed} 个")
          if failed > 0:
              exit(1)
          EOF
