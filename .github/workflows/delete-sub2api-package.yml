name: Delete Old Package

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete sub2api package
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/sub2api)
          echo "HTTP Status: $status"
          cat response.json
          if [ "$status" -eq 204 ]; then
            echo "Successfully deleted package sub2api"
          elif [ "$status" -eq 403 ]; then
            echo "GHCR_TOKEN does not have delete:packages scope"
            exit 1
          else
            exit 1
          fi
